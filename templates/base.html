{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>{% block title %}Cake House DV{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <nav class="navbar">
        <h2 class="logo">🍰 Cake House DV</h2>
        <div>
            <a href="{% url 'cakes:home' %}">Home</a>
            <a href="{% url 'cakes:gallery' %}">Gallery</a>
            <a href="{% url 'cakes:about' %}">About</a>
        </div>

        <div>
            {% if user.is_authenticated %}
                <a href="{% url 'review:add' %}">Post Review</a>
                {% if user.is_staff %}
                    <a href="{% url 'cakes:add_cake' %}">Add Cake</a>
                {% endif %}
                <form method="post" action="{% url 'logout' %}" class="nav-logout-form">
                    {% csrf_token %}
                    <button type="submit" class="nav-link-btn">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'cakes:signup' %}">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
