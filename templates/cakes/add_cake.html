{% extends 'base.html' %}
{% block title %}Add cake — Cake House{% endblock %}
{% block content %}

<div class="card">
    <h1 class="page-title">Add new cake</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Add cake</button>
    </form>
</div>

{% endblock %}
